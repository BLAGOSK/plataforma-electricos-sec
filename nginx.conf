server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/pdf;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Comprobación de salud para Docker / balanceadores
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Recursos con hash en el nombre: caché larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archivos de ejemplo de la maqueta
    location /mock-files/ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html nunca se cachea para que los despliegues se vean de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback de SPA: cualquier ruta del cliente (React Router) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
