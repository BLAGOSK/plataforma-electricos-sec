services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    image: plataforma-electricos-sec:latest
    container_name: plataforma-electricos-sec
    ports:
      - "${PUERTO_WEB:-8080}:80"
    restart: unless-stopped

